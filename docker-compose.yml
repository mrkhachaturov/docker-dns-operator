# Full example — one container, one label, three providers.
#
# This is the comprehensive showcase: the operator + the RFC2136 sidecar +
# a busybox "target" container that carries a single label routing two
# records (A + MX) to Cloudflare, MikroTik, and Active Directory at once.
#
# How to run:
#   1. cp .env.example .env
#   2. edit .env and fill in your real values
#      (.env is gitignored; .env.example documents every variable)
#   3. docker compose up --build
#
# For provider-specific minimal examples, see examples/cloudflare,
# examples/mikrotik, and examples/rfc2136.

services:
  docker-dns-operator:
    image: mrkhachaturov/docker-dns-operator:dev
    build: .
    depends_on:
      - ddo-rfc2136
    environment:
      LOG_LEVEL: debug
      PROJECT_LABEL: docker-dns-operator
      INSTANCE_ID: full-example
      EXECUTION_FREQUENCY_SECONDS: 30

      # --- Cloudflare ---------------------------------------------------------
      # Either API_TOKEN (env) or API_TOKEN_FILE (Docker secret). Prefer _FILE.
      API_TOKEN: ${CF_API_TOKEN:?set CF_API_TOKEN in .env}

      # --- MikroTik RouterOS --------------------------------------------------
      MIKROTIK_BASEURL: ${MIKROTIK_BASEURL:?set MIKROTIK_BASEURL in .env}
      MIKROTIK_USERNAME: ${MIKROTIK_USERNAME:?set MIKROTIK_USERNAME in .env}
      MIKROTIK_PASSWORD: ${MIKROTIK_PASSWORD:?set MIKROTIK_PASSWORD in .env}
      MIKROTIK_SKIP_TLS_VERIFY: ${MIKROTIK_SKIP_TLS_VERIFY:-true}

      # --- RFC2136 / Active Directory (talks to ddo-rfc2136 sidecar) ----------
      RFC2136_WEBHOOK_URL: http://ddo-rfc2136:9090
      RFC2136_AUTH_MODE: gss-tsig
      RFC2136_HOSTS: ${RFC2136_HOSTS:?set RFC2136_HOSTS in .env}
      RFC2136_ZONES: ${RFC2136_ZONES:?set RFC2136_ZONES in .env}
      RFC2136_KERBEROS_REALM: ${RFC2136_KERBEROS_REALM:?set RFC2136_KERBEROS_REALM in .env}
      RFC2136_KERBEROS_PRINCIPAL: ${RFC2136_KERBEROS_PRINCIPAL:?set RFC2136_KERBEROS_PRINCIPAL in .env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  ddo-rfc2136:
    image: ddo-rfc2136:dev
    build: ./sidecars/ddo-rfc2136
    environment:
      WEBHOOK_LISTEN: ":9090"
      RFC2136_KERBEROS_REALM: ${RFC2136_KERBEROS_REALM:?set RFC2136_KERBEROS_REALM in .env}
      RFC2136_KERBEROS_PRINCIPAL: ${RFC2136_KERBEROS_PRINCIPAL:?set RFC2136_KERBEROS_PRINCIPAL in .env}
      RFC2136_KRB5_CONF: /etc/krb5.conf
      RFC2136_DRY_RUN: ${RFC2136_DRY_RUN:-false}
      # Pick exactly one auth mode by populating the matching var in .env.
      # The other three must stay empty.
      RFC2136_AD_PASSWORD: ${RFC2136_AD_PASSWORD:-}
      RFC2136_KEYTAB_BASE64: ${RFC2136_KEYTAB_BASE64:-}
    volumes:
      - ./examples/rfc2136/krb5.conf:/etc/krb5.conf:ro

  target:
    image: busybox:latest
    command: sleep 3600
    labels:
      docker-dns-operator:full-example: |
        [
          { "type": "A",
            "name": "${TEST_RECORD_NAME:?set TEST_RECORD_NAME in .env}",
            "address": "${TEST_RECORD_VALUE:?set TEST_RECORD_VALUE in .env}",
            "providers": ["cf", "mikrotik", "rfc2136"] },

          { "type": "MX",
            "name": "${TEST_RECORD_NAME:?set TEST_RECORD_NAME in .env}",
            "server": "${TEST_RECORD_NAME:?}",
            "priority": 10,
            "providers": ["cf", "mikrotik", "rfc2136"] }
        ]
