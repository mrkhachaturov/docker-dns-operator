# Example: Cloudflare-only DNS sync via the ddo-cloudflare sidecar.
#
# How to run:
#   1. cp .env.example .env
#   2. edit .env and fill in CF_API_TOKEN + TEST_RECORD_* values
#   3. docker compose up --build
#
# Verify:
#   dig @1.1.1.1 ${TEST_RECORD_NAME}     # should return TEST_RECORD_VALUE
#
# The operator only manages records tagged with PROJECT_LABEL:INSTANCE_ID
# (here `docker-dns-operator:cloudflare-example`). Unrelated Cloudflare
# records in the zone are never touched.

services:
  ddo-cloudflare:
    image: ghcr.io/mrkhachaturov/ddo-cloudflare:0.1.2
    build: ../../sidecars/ddo-cloudflare
    environment:
      WEBHOOK_LISTEN: ':9090'
      CLOUDFLARE_API_TOKEN: ${CF_API_TOKEN:?set CF_API_TOKEN in .env}
      CLOUDFLARE_ZONES: ${CF_ZONES:-}
      # Proxy state is per-record via providerOptions.cf.proxy label.

  docker-dns-operator:
    image: ghcr.io/mrkhachaturov/docker-dns-operator:0.2.0
    build: ../..
    depends_on:
      - ddo-cloudflare
    environment:
      LOG_LEVEL: debug
      PROJECT_LABEL: docker-dns-operator
      INSTANCE_ID: cloudflare-example
      EXECUTION_FREQUENCY_SECONDS: 30
      # Coalesce bursts of Docker events (e.g. a compose up creating many
      # services at once) into a single reconcile. Range 50–10000.
      RECONCILE_DEBOUNCE_MS: 500
      WEBHOOK_CF_URL: http://ddo-cloudflare:9090
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  target:
    image: busybox:latest
    command: sleep 3600
    labels:
      docker-dns-operator:cloudflare-example: |
        [
          { "type": "A",
            "name": "${TEST_RECORD_NAME:?set TEST_RECORD_NAME in .env}",
            "address": "${TEST_RECORD_VALUE:?set TEST_RECORD_VALUE in .env}",
            "providers": ["cf"],
            "providerOptions": { "cf": { "proxy": false } } }
        ]
