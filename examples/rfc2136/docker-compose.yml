# Example: RFC2136 / Active Directory DNS via the ddo-rfc2136 sidecar.
#
# How to run:
#   1. cp .env.example .env
#   2. edit .env and fill in RFC2136_* values + one of:
#        - RFC2136_AD_PASSWORD  (simplest)
#        - RFC2136_KEYTAB_BASE64 (defense-in-depth)
#   3. cp krb5.conf.example krb5.conf and adjust if needed
#   4. docker compose up --build
#
# Verify:
#   dig @${RFC2136_DC_FOR_DIG} ${TEST_RECORD_NAME}
#
# The operator scopes itself to RFC2136_ZONES + the ownership tag
# `docker-dns-operator:rfc2136-example`. Existing AD records outside that
# tag are never touched.

services:
  docker-dns-operator:
    image: mrkhachaturov/docker-dns-operator:dev
    build: ../..
    depends_on:
      - ddo-rfc2136
    environment:
      LOG_LEVEL: debug
      PROJECT_LABEL: docker-dns-operator
      INSTANCE_ID: rfc2136-example
      EXECUTION_FREQUENCY_SECONDS: 30
      WEBHOOK_RFC2136_URL: http://ddo-rfc2136:9090
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  ddo-rfc2136:
    image: mrkhachaturov/ddo-rfc2136:dev
    build: ../../sidecars/ddo-rfc2136
    environment:
      WEBHOOK_LISTEN: ":9090"
      RFC2136_HOSTS: ${RFC2136_HOSTS:?set RFC2136_HOSTS in .env}
      RFC2136_ZONES: ${RFC2136_ZONES:?set RFC2136_ZONES in .env}
      RFC2136_KERBEROS_REALM: ${RFC2136_KERBEROS_REALM:?set RFC2136_KERBEROS_REALM in .env}
      RFC2136_KERBEROS_PRINCIPAL: ${RFC2136_KERBEROS_PRINCIPAL:?set RFC2136_KERBEROS_PRINCIPAL in .env}
      RFC2136_KRB5_CONF: /etc/krb5.conf
      RFC2136_DRY_RUN: ${RFC2136_DRY_RUN:-false}
      # Pick exactly one auth mode by populating the matching var in .env.
      # The other must stay unset.
      RFC2136_AD_PASSWORD: ${RFC2136_AD_PASSWORD:-}
      RFC2136_KEYTAB_BASE64: ${RFC2136_KEYTAB_BASE64:-}
    volumes:
      - ./krb5.conf:/etc/krb5.conf:ro

  target:
    image: busybox:latest
    command: sleep 3600
    labels:
      docker-dns-operator:rfc2136-example: |
        [
          { "type": "A",
            "name": "${TEST_RECORD_NAME:?set TEST_RECORD_NAME in .env}",
            "address": "${TEST_RECORD_VALUE:?set TEST_RECORD_VALUE in .env}",
            "providers": ["rfc2136"] }
        ]
