# Example: RFC2136 / Active Directory DNS via the ddo-rfc2136 sidecar — Swarm mode.
#
# Same outcome as docker-compose.yml in this folder, but deployed via
# `docker stack deploy`. The operator runs on a manager and reads
# service-level labels via listServices (auto-detected from `docker info`).
#
# Run:
#   set -a; source .env; set +a
#   docker compose -f docker-compose.yml build       # swarm pulls; build first
#   docker stack deploy -c docker-stack.yml ddo-rfc2136
#
# Tear down:
#   docker stack rm ddo-rfc2136

services:
  docker-dns-operator:
    image: ghcr.io/mrkhachaturov/docker-dns-operator:0.1.0
    environment:
      LOG_LEVEL: debug
      PROJECT_LABEL: docker-dns-operator
      INSTANCE_ID: rfc2136-example
      EXECUTION_FREQUENCY_SECONDS: "30"
      WEBHOOK_RFC2136_URL: http://ddo-rfc2136:9090
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  ddo-rfc2136:
    image: ghcr.io/mrkhachaturov/ddo-rfc2136:0.1.0
    environment:
      WEBHOOK_LISTEN: ":9090"
      RFC2136_HOSTS: ${RFC2136_HOSTS:?set RFC2136_HOSTS in .env}
      RFC2136_ZONES: ${RFC2136_ZONES:?set RFC2136_ZONES in .env}
      RFC2136_KERBEROS_REALM: ${RFC2136_KERBEROS_REALM:?set RFC2136_KERBEROS_REALM in .env}
      RFC2136_KERBEROS_PRINCIPAL: ${RFC2136_KERBEROS_PRINCIPAL:?set RFC2136_KERBEROS_PRINCIPAL in .env}
      RFC2136_KRB5_CONF: /etc/krb5.conf
      RFC2136_DRY_RUN: ${RFC2136_DRY_RUN:-false}
      RFC2136_AD_PASSWORD: ${RFC2136_AD_PASSWORD:-}
      RFC2136_KEYTAB_BASE64: ${RFC2136_KEYTAB_BASE64:-}
    configs:
      - source: krb5_conf
        target: /etc/krb5.conf
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  target:
    image: busybox:latest
    command: sleep 3600
    deploy:
      labels:
        docker-dns-operator:rfc2136-example: |
          [
            { "type": "A",
              "name": "${TEST_RECORD_NAME:?set TEST_RECORD_NAME in .env}",
              "address": "${TEST_RECORD_VALUE:?set TEST_RECORD_VALUE in .env}",
              "providers": ["rfc2136"] }
          ]
      replicas: 1
      restart_policy:
        condition: on-failure

configs:
  krb5_conf:
    file: ./krb5.conf
