# Example: MikroTik-only DNS sync (via the ddo-mikrotik sidecar).
#
# How to run:
#   1. cp .env.example .env
#   2. edit .env and fill in MIKROTIK_* + TEST_RECORD_* values
#   3. docker compose up --build
#
# Verify:
#   dig @${MIKROTIK_DNS_IP} ${TEST_RECORD_NAME}    # see README for MIKROTIK_DNS_IP
#
# MikroTik has no notion of "zones" by default — the sidecar accepts any FQDN
# unless MIKROTIK_ZONES is set. Every row written gets `comment=docker-dns-operator:mikrotik-example`,
# so your existing static DNS is untouched. Two operators sharing the same
# router and using different INSTANCE_ID values each see only their own rows.

services:
  docker-dns-operator:
    image: ghcr.io/mrkhachaturov/docker-dns-operator:0.2.0
    build: ../..
    depends_on:
      - ddo-mikrotik
    environment:
      LOG_LEVEL: debug
      PROJECT_LABEL: docker-dns-operator
      INSTANCE_ID: mikrotik-example
      EXECUTION_FREQUENCY_SECONDS: 30
      # Coalesce bursts of Docker events (e.g. a compose up creating many
      # services at once) into a single reconcile. Range 50–10000.
      RECONCILE_DEBOUNCE_MS: 500
      WEBHOOK_MIKROTIK_URL: http://ddo-mikrotik:9090
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  ddo-mikrotik:
    image: ghcr.io/mrkhachaturov/ddo-mikrotik:0.2.0
    build: ../../sidecars/ddo-mikrotik
    environment:
      WEBHOOK_LISTEN: ':9090'
      MIKROTIK_ADDRESS: ${MIKROTIK_ADDRESS:?set MIKROTIK_ADDRESS in .env}
      MIKROTIK_USERNAME: ${MIKROTIK_USERNAME:?set MIKROTIK_USERNAME in .env}
      MIKROTIK_PASSWORD: ${MIKROTIK_PASSWORD:?set MIKROTIK_PASSWORD in .env}
      MIKROTIK_USE_TLS: ${MIKROTIK_USE_TLS:-false}
      MIKROTIK_SKIP_TLS_VERIFY: ${MIKROTIK_SKIP_TLS_VERIFY:-false}
      MIKROTIK_ZONES: ${MIKROTIK_ZONES:-}

  target:
    image: busybox:latest
    command: sleep 3600
    labels:
      docker-dns-operator:mikrotik-example: |
        [
          { "type": "A",
            "name": "${TEST_RECORD_NAME:?set TEST_RECORD_NAME in .env}",
            "address": "${TEST_RECORD_VALUE:?set TEST_RECORD_VALUE in .env}",
            "providers": ["mikrotik"] }
        ]
