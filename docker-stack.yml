# Full example — all three providers, Docker Swarm flavour.
#
# Same outcome as docker-compose.yml at root, but deployed via
# `docker stack deploy`. The operator runs on a manager and reads
# service-level labels via listServices (auto-detected from `docker info`).
#
# Run:
#   cp .env.example .env  (then edit — .env is gitignored)
#   cp examples/rfc2136/krb5.conf.example examples/rfc2136/krb5.conf
#     (then edit realm + KDC hosts — krb5.conf is gitignored)
#   set -a; source .env; set +a
#   docker stack deploy -c docker-stack.yml ddo
#
# Tear down:
#   docker stack rm ddo
#
# .env is the same as for docker-compose.yml — see .env.example for the
# variable list. `docker stack deploy` does not auto-load .env, hence the
# `set -a; source .env; set +a` step above.
#
# All `build:` directives are omitted — swarm pulls images, doesn't build.
# Build any local image first with `docker compose build` against the
# matching docker-compose.yml.

# Each image ships its own Dockerfile HEALTHCHECK. The explicit compose-level
# `healthcheck:` blocks below mirror those defaults so they show up in
# `docker service inspect` and are easy to override per environment. Swarm
# does NOT honour `depends_on: condition: service_healthy` — these are for
# observability and `docker service ps` reporting, not start ordering.
services:
  docker-dns-operator:
    image: ghcr.io/mrkhachaturov/docker-dns-operator:0.1.3
    environment:
      # =====================================================================
      # Operator-side environment. Every var the operator understands is
      # listed below — uncommented entries are this example's settings;
      # commented entries show the default + describe the option. Full
      # reference: src/app.configuration.ts (the Joi schema is the source
      # of truth) and the README "Configuration" section.
      # =====================================================================

      # --- Identity & ownership --------------------------------------------
      # The Docker label key the operator watches is
      # `${PROJECT_LABEL}:${INSTANCE_ID}` and every record it writes carries
      # that string as its ownership marker. Two operators with different
      # INSTANCE_IDs share a zone safely — each only touches its own records.
      # Defaults: PROJECT_LABEL=docker-dns-operator, INSTANCE_ID=1.
      PROJECT_LABEL: docker-dns-operator
      INSTANCE_ID: full-example-swarm

      # --- Reconcile loop ---------------------------------------------------
      # Reconciliation is event-driven: the operator subscribes to Docker
      # container AND swarm-service events and reconciles within
      # RECONCILE_DEBOUNCE_MS of any change. EXECUTION_FREQUENCY_SECONDS is
      # the FALLBACK interval — safety net for missed events AND the only
      # mechanism that propagates DDNS public-IP changes (no Docker event
      # fires for those). Keep low if you use DDNS. Default: 60.
      EXECUTION_FREQUENCY_SECONDS: '30'
      # Coalesces a burst of events (e.g. a stack deploy creating 10 services
      # at once) into a single reconcile pass. Range 50–10000. Default: 500.
      RECONCILE_DEBOUNCE_MS: '500'

      # --- DDNS (only relevant when entries use `"address": "DDNS"`) -------
      # How often to re-fetch the host's public IPv4 from ipinfo.io. Has
      # no effect when no entry uses the "DDNS" literal. Default: 60.
      # DDNS_EXECUTION_FREQUENCY_MINUTES: "60"

      # --- Behaviour --------------------------------------------------------
      # If true: keep DNS records for stopped containers (standalone) or
      # services with RunningTasks=0 (Swarm). Removed services
      # (`docker service rm`) always drop their records regardless.
      # Default: false.
      # PRESERVE_STOPPED: "false"
      # Per-request timeout (seconds) for operator → sidecar webhook calls.
      # Bounds how long any one provider can hang the reconcile loop.
      # Default: 15.
      # WEBHOOK_TIMEOUT_SECONDS: "15"

      # --- Observability ----------------------------------------------------
      # log/debug/warn/error/verbose/fatal. Default: error.
      LOG_LEVEL: debug
      # HTTP port for GET /healthz liveness endpoint. Mirrors the sidecars'
      # default. Returns 200 {"status":"ok"} when the process is responding.
      # Default: 9090.
      # HEALTH_PORT: "9090"

      # --- Provider sidecars (any number, via WEBHOOK_<NAME>_URL) -----------
      # Every env var matching WEBHOOK_<NAME>_URL registers a provider whose
      # key is <NAME> lowercased with `_` → `-`. Per-entry routing in the
      # label's `providers: [...]` field selects which sidecars handle it.
      # The operator side of each provider is just the URL; everything else
      # (API tokens, hosts, zones, Kerberos, TTLs) lives on the sidecar.
      WEBHOOK_CF_URL: http://ddo-cloudflare:9090
      WEBHOOK_MIKROTIK_URL: http://ddo-mikrotik:9090
      WEBHOOK_RFC2136_URL: http://ddo-rfc2136:9090
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      # /healthz served by the operator on HEALTH_PORT (default 9090, same as
      # the sidecars). Returns 200 if the HTTP server is responding — pure
      # liveness. Provider/sidecar failures are surfaced through logs, not
      # through this probe (so a sidecar outage does NOT trigger an operator
      # restart-storm). Each sidecar carries its own healthcheck for its state.
      test:
        [
          'CMD-SHELL',
          'wget -q --spider http://127.0.0.1:9090/healthz || exit 1',
        ]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  ddo-cloudflare:
    image: ghcr.io/mrkhachaturov/ddo-cloudflare:0.1.1
    environment:
      WEBHOOK_LISTEN: ':9090'
      CLOUDFLARE_API_TOKEN: ${CF_API_TOKEN:?set CF_API_TOKEN in .env}
      CLOUDFLARE_ZONES: ${CF_ZONES:-}
      CLOUDFLARE_DEFAULT_TTL: ${CF_DEFAULT_TTL:-1}
      # Proxy state is per-record via providerOptions.cf.proxy label.
    healthcheck:
      # Distroless: no shell. The webhook binary doubles as its own probe via
      # the `healthcheck` subcommand — exit 0 iff GET /healthz returns 2xx.
      test: ['CMD', '/usr/local/bin/webhook', 'healthcheck']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      restart_policy:
        condition: on-failure

  ddo-mikrotik:
    image: ghcr.io/mrkhachaturov/ddo-mikrotik:0.1.1
    environment:
      WEBHOOK_LISTEN: ':9090'
      MIKROTIK_ADDRESS: ${MIKROTIK_ADDRESS:?set MIKROTIK_ADDRESS in .env}
      MIKROTIK_USERNAME: ${MIKROTIK_USERNAME:?set MIKROTIK_USERNAME in .env}
      MIKROTIK_PASSWORD: ${MIKROTIK_PASSWORD:?set MIKROTIK_PASSWORD in .env}
      MIKROTIK_USE_TLS: ${MIKROTIK_USE_TLS:-false}
      MIKROTIK_SKIP_TLS_VERIFY: ${MIKROTIK_SKIP_TLS_VERIFY:-false}
      MIKROTIK_ZONES: ${MIKROTIK_ZONES:-}
    healthcheck:
      test: ['CMD', '/usr/local/bin/webhook', 'healthcheck']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  ddo-rfc2136:
    image: ghcr.io/mrkhachaturov/ddo-rfc2136:0.1.1
    environment:
      WEBHOOK_LISTEN: ':9090'
      RFC2136_HOSTS: ${RFC2136_HOSTS:?set RFC2136_HOSTS in .env}
      RFC2136_ZONES: ${RFC2136_ZONES:?set RFC2136_ZONES in .env}
      RFC2136_KERBEROS_REALM: ${RFC2136_KERBEROS_REALM:?set RFC2136_KERBEROS_REALM in .env}
      RFC2136_KERBEROS_PRINCIPAL: ${RFC2136_KERBEROS_PRINCIPAL:?set RFC2136_KERBEROS_PRINCIPAL in .env}
      RFC2136_KRB5_CONF: /etc/krb5.conf
      RFC2136_DRY_RUN: ${RFC2136_DRY_RUN:-false}
      RFC2136_AD_PASSWORD: ${RFC2136_AD_PASSWORD:-}
      RFC2136_KEYTAB_BASE64: ${RFC2136_KEYTAB_BASE64:-}
    configs:
      - source: krb5_conf
        target: /etc/krb5.conf
    healthcheck:
      # Alpine base — busybox wget probes /healthz (Kerberos TGT freshness).
      test:
        [
          'CMD-SHELL',
          'wget -q --spider http://127.0.0.1:9090/healthz || exit 1',
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  target:
    image: busybox:latest
    command: sleep 3600
    deploy:
      labels:
        docker-dns-operator:full-example-swarm: |
          [
            { "type": "A",
              "name": "${TEST_RECORD_NAME:?set TEST_RECORD_NAME in .env}",
              "address": "${TEST_RECORD_VALUE:?set TEST_RECORD_VALUE in .env}",
              "providers": ["cf", "mikrotik", "rfc2136"] },

            { "type": "MX",
              "name": "${TEST_RECORD_NAME:?}",
              "server": "${TEST_RECORD_NAME:?}",
              "priority": 10,
              "providers": ["cf", "mikrotik", "rfc2136"] }
          ]
      replicas: 1
      restart_policy:
        condition: on-failure

configs:
  krb5_conf:
    file: ./examples/rfc2136/krb5.conf
